<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google tag (gtag.js) - Consent Mode Setup -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Set default consent to 'denied' before any tracking
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
    </script>
    
    <!-- Primary Meta Tags -->
    <title>DGNO - Data-Driven, Independent, Pro-Democracy News</title>
    <meta name="title" content="DGNO - Data-Driven, Independent, Pro-Democracy News">
    <meta name="description" content="Independent, evidence-led news and public-interest reporting focused on democracy, constitutional rights, corruption, government accountability, and human rights.">
    <meta name="keywords" content="data-driven news, pro-democracy news, constitutional news, pro-human rights news, independent news, anti-corruption news, investigative journalism, government accountability, transparency">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="language" content="English">
    <meta name="author" content="DGNO">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dgno.us/">
    <meta property="og:title" content="DGNO - Data-Driven, Independent, Pro-Democracy News">
    <meta property="og:description" content="Independent, evidence-led news and public-interest reporting focused on democracy, constitutional rights, corruption, government accountability, and human rights.">
    <meta property="og:image" content="https://dgno.us/logo.png">
    <meta property="og:site_name" content="DGNO">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://dgno.us/">
    <meta name="twitter:title" content="DGNO - Data-Driven, Independent, Pro-Democracy News">
    <meta name="twitter:description" content="Independent, evidence-led news and public-interest reporting focused on democracy, constitutional rights, corruption, government accountability, and human rights.">
    <meta name="twitter:image" content="https://dgno.us/logo.png">
    
    <!-- Additional SEO -->
    <link rel="canonical" href="https://dgno.us/">
    <link rel="alternate" type="application/rss+xml" title="DGNO RSS" href="https://dgno.us/rss.xml">
    <link rel="alternate" type="application/atom+xml" title="DGNO Atom" href="https://dgno.us/atom.xml">
    <meta name="theme-color" content="#6e86ff">

    <script type="application/ld+json" data-schema="site-identity">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "NewsMediaOrganization",
            "@id": "https://dgno.us/#organization",
            "name": "DGNO",
            "url": "https://dgno.us/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://dgno.us/logo.png",
              "width": 500,
              "height": 500
            },
            "sameAs": [
              "https://www.tiktok.com/@dgnonews",
              "https://www.instagram.com/dgnonews"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://dgno.us/#website",
            "url": "https://dgno.us/",
            "name": "DGNO",
            "publisher": { "@id": "https://dgno.us/#organization" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
