name: Deploy to Firebase Hosting on main

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: npm install

      - name: Install dependencies (app)
        run: npm install
        working-directory: ./app

      - name: Build frontend
        run: npm run build
        working-directory: ./app

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v13.0.2
        with:
          args: deploy --only hosting,functions,firestore,storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
